name: Build

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src/BannerlordCpuOptimizer/BannerlordCpuOptimizer.csproj
      - name: Build and run Milestone 2 safety gates
        shell: pwsh
        run: .\build.ps1 -Configuration Release
      - name: Package module
        shell: pwsh
        run: .\package.ps1 -Configuration Release
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: BannerlordCpuOptimizer-v0.2.0-milestone2
          path: |
            artifacts/BannerlordCpuOptimizer-v0.2.0-milestone2.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
