name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.3.2
      RELEASE_TITLE: Bannerlord CPU Optimizer v0.3.2 - Automatic benchmark completion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            src/BannerlordCpuOptimizer/BannerlordCpuOptimizer.csproj
            tests/BannerlordCpuOptimizer.HarmonyTeardownHarness/BannerlordCpuOptimizer.HarmonyTeardownHarness.csproj
      - name: Build and run Milestone 3 MCM safety gates
        shell: pwsh
        run: .\build.ps1 -Configuration Release
      - name: Package module
        shell: pwsh
        run: .\package.ps1 -Configuration Release
      - name: Verify package contents
        shell: pwsh
        run: |
          $zip = '.\artifacts\BannerlordCpuOptimizer-v0.3.2-auto-benchmark.zip'
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try {
            $entries = $archive.Entries.FullName
            $required = @(
              'Modules/BannerlordCpuOptimizer/SubModule.xml',
              'Modules/BannerlordCpuOptimizer/bin/Win64_Shipping_Client/BannerlordCpuOptimizer.dll'
            )
            foreach ($path in $required) {
              if ($entries -notcontains $path) { throw "Release archive is missing $path" }
            }
            if ($entries | Where-Object { $_ -match 'settings(\.|-)|(^|/)0Harmony\.dll$|(^|/)TaleWorlds\..*\.dll$|(^|/)TOR_Core\.dll$|(^|/)MCM.*\.dll$|HarmonyTeardownHarness' }) {
              throw 'Release archive contains a manual settings template, third-party runtime, or test assembly.'
            }
          } finally {
            $archive.Dispose()
          }
      - name: Create GitHub release
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          }
          gh release create $env:RELEASE_TAG `
            '.\artifacts\BannerlordCpuOptimizer-v0.3.2-auto-benchmark.zip' `
            '.\artifacts\SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --notes-file '.\.github\release-notes\v0.3.2.md' `
            --latest
