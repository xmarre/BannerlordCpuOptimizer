name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.1.1
      RELEASE_TITLE: Bannerlord CPU Optimizer v0.1.1 - Profiler settings fix
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: src/BannerlordCpuOptimizer/BannerlordCpuOptimizer.csproj
      - name: Build and run profiler-only gates
        shell: pwsh
        run: .\build.ps1 -Configuration Release
      - name: Package module
        shell: pwsh
        run: .\package.ps1 -Configuration Release
      - name: Verify package contents
        shell: pwsh
        run: |
          $zip = '.\artifacts\BannerlordCpuOptimizer-v0.1.1-profiler-only.zip'
          $entries = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.FullName
          $required = @(
            'Modules/BannerlordCpuOptimizer/SubModule.xml',
            'Modules/BannerlordCpuOptimizer/bin/Win64_Shipping_Client/BannerlordCpuOptimizer.dll',
            'Modules/BannerlordCpuOptimizer/ModuleData/BannerlordCpuOptimizer/settings.json',
            'Modules/BannerlordCpuOptimizer/ModuleData/BannerlordCpuOptimizer/settings.profiler.json'
          )
          foreach ($path in $required) {
            if ($entries -notcontains $path) { throw "Release archive is missing $path" }
          }
          if ($entries | Where-Object { $_ -match '(^|/)0Harmony\.dll$|(^|/)TaleWorlds\..*\.dll$|(^|/)TOR_Core\.dll$' }) {
            throw 'Release archive contains a forbidden third-party runtime assembly.'
          }
      - name: Create GitHub release
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          }
          gh release create $env:RELEASE_TAG `
            '.\artifacts\BannerlordCpuOptimizer-v0.1.1-profiler-only.zip' `
            '.\artifacts\SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TITLE `
            --notes-file '.\.github\release-notes\v0.1.1.md' `
            --latest
